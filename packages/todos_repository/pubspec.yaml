name: todos_repository
description: A repository that handles todo related requests.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  forui: ^0.24.3
  todos_api:
    path: ../todos_api

dev_dependencies:
  forui_cli: ^0.24.0
  mocktail: ^1.0.5
  test: ^1.21.4
flutter:
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora/Lora.ttf
        - asset: assets/fonts/Lora/Lora-Italic.ttf
          style: italic
